<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Google Wallet Test</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
      }

      h1 {
        margin-bottom: 10px;
      }

      textarea {
        width: 100%;
        min-height: 180px;
        padding: 12px;
        box-sizing: border-box;
        font-family: monospace;
      }

      button {
        margin-top: 15px;
        padding: 12px 20px;
        cursor: pointer;
      }

      #wallet-button {
        margin-top: 30px;
      }

      #result {
        margin-top: 30px;
        padding: 15px;
        white-space: pre-wrap;
        border: 1px solid #ddd;
      }
    </style>

    <!-- Google Wallet JavaScript -->
    <script
      src="https://apis.google.com/js/platform.js"
      type="text/javascript"></script>
  </head>

  <body>
    <h1>Google Wallet Test</h1>

    <p>Paste the JWT generated by Salesforce below.</p>

    <textarea id="jwt" placeholder="Paste Google Wallet JWT here..."></textarea>

    <br />

    <button onclick="renderWalletButton()">Load Google Wallet Button</button>

    <div id="wallet-button"></div>

    <div id="result">Waiting for JWT...</div>

    <script>
      function renderWalletButton() {
        const jwt = document.getElementById("jwt").value.trim();

        const result = document.getElementById("result");

        if (!jwt) {
          result.innerText = "ERROR: Please paste the JWT first.";

          return;
        }

        // Clear previous button
        document.getElementById("wallet-button").innerHTML = "";

        result.innerText = "Rendering Google Wallet button...";

        // Render official Google Wallet button
        gapi.savetoandroidpay.render("wallet-button", {
          jwt: jwt,

          onsuccess: "googleWalletSuccess",

          onfailure: "googleWalletFailure",
        });
      }

      function googleWalletSuccess() {
        const result = document.getElementById("result");

        result.innerText =
          "SUCCESS!\n\n" + "Google Wallet accepted the save operation.";
      }

      function googleWalletFailure(error) {
        const result = document.getElementById("result");

        console.log("Google Wallet Error:", error);

        result.innerText =
          "GOOGLE WALLET ERROR\n\n" +
          "Error Code: " +
          error.errorCode +
          "\n\n" +
          "Error Message: " +
          error.errorMessage;
      }
    </script>
  </body>
</html>
