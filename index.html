<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Google Wallet Test</title>

    <script
      src="https://apis.google.com/js/platform.js"
      type="text/javascript"></script>
  </head>

  <body>
    <h1>Google Wallet Test</h1>

    <p>Paste ONLY the JWT here.</p>

    <textarea
      id="jwt"
      rows="10"
      cols="100"
      placeholder="Paste only the JWT, not https://pay.google.com/gp/v/save/"></textarea>

    <br /><br />

    <button onclick="testJwt()">Test Google Wallet JS Button</button>

    <br /><br />

    <div id="wallet-button"></div>

    <pre id="result">
Waiting...
    </pre>

    <script>
      function testJwt() {
        const jwt = document.getElementById("jwt").value.trim();

        const result = document.getElementById("result");

        if (!jwt) {
          result.textContent = "ERROR: JWT is empty.";

          return;
        }

        // ----------------------------------------------------
        // BASIC JWT VALIDATION
        // ----------------------------------------------------

        const parts = jwt.split(".");

        result.textContent = "JWT parts: " + parts.length;

        if (parts.length !== 3) {
          result.textContent += "\nERROR: JWT must contain exactly 3 parts.";

          return;
        }

        // ----------------------------------------------------
        // DECODE PAYLOAD
        // ----------------------------------------------------

        try {
          const payloadBase64 = parts[1].replace(/-/g, "+").replace(/_/g, "/");

          const padded =
            payloadBase64 + "=".repeat((4 - (payloadBase64.length % 4)) % 4);

          const payloadJson = atob(padded);

          const payload = JSON.parse(payloadJson);

          console.log("Google Wallet JWT Payload:", payload);

          // ------------------------------------------------
          // CHECK ORIGIN
          // ------------------------------------------------

          if (!payload.origins) {
            result.textContent += "\n\nERROR: JWT does NOT contain origins.";

            return;
          }

          result.textContent +=
            "\nOrigin(s) inside JWT:\n" +
            JSON.stringify(payload.origins, null, 2);

          result.textContent +=
            "\n\nCurrent page origin:\n" + window.location.origin;

          if (!payload.origins.includes(window.location.origin)) {
            result.textContent += "\n\nERROR: ORIGIN MISMATCH.";

            return;
          }

          result.textContent += "\n\nOrigin matches!";
        } catch (error) {
          result.textContent += "\n\nERROR decoding JWT:\n" + error.message;

          return;
        }

        // ----------------------------------------------------
        // RENDER GOOGLE BUTTON
        // ----------------------------------------------------

        document.getElementById("wallet-button").innerHTML = "";

        try {
          gapi.savetoandroidpay.render("wallet-button", {
            jwt: jwt,

            onsuccess: "googleWalletSuccess",

            onfailure: "googleWalletFailure",
          });

          result.textContent += "\n\nGoogle Wallet button rendered.";
        } catch (error) {
          result.textContent += "\n\nRender error:\n" + error.message;
        }
      }

      function googleWalletSuccess() {
        document.getElementById("result").textContent =
          "SUCCESS!\n\n" + "Google Wallet accepted the pass.";
      }

      function googleWalletFailure(error) {
        console.log("Google Wallet Error:", error);

        document.getElementById("result").textContent =
          "GOOGLE WALLET ERROR\n\n" +
          "Error Code: " +
          error.errorCode +
          "\n\n" +
          "Error Message: " +
          error.errorMessage;
      }
    </script>
  </body>
</html>
