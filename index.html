<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Google Wallet Test</title>

    <!-- Google Wallet JavaScript API -->
    <script
      src="https://apis.google.com/js/platform.js"
      type="text/javascript"></script>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
      }

      h1 {
        margin-bottom: 10px;
      }

      textarea {
        width: 100%;
        height: 220px;
        padding: 12px;
        font-family: monospace;
        font-size: 13px;
        box-sizing: border-box;
        margin-top: 10px;
      }

      button {
        padding: 12px 20px;
        margin-top: 15px;
        margin-right: 10px;
        cursor: pointer;
        font-size: 15px;
      }

      #result {
        margin-top: 25px;
        padding: 15px;
        background: #f5f5f5;
        white-space: pre-wrap;
        word-break: break-word;
      }

      #wallet-button {
        margin-top: 20px;
      }
    </style>
  </head>

  <body>
    <h1>Google Wallet Test</h1>

    <p>Paste your Google Wallet JWT below.</p>

    <textarea id="jwt" placeholder="Paste Google Wallet JWT here..."></textarea>

    <br />

    <!-- Direct Save-to-Wallet URL -->
    <button onclick="openWallet()">Add to Google Wallet</button>

    <!-- Google Wallet JS Button -->
    <button onclick="renderWalletButton()">Test Google Wallet JS Button</button>

    <div id="wallet-button"></div>

    <div id="result">Waiting for JWT...</div>

    <script>
      // ============================================================
      // Get JWT
      // ============================================================

      function getJwt() {
        const jwt = document.getElementById("jwt").value.trim();

        if (!jwt) {
          document.getElementById("result").innerText =
            "ERROR: Please paste your Google Wallet JWT first.";

          return null;
        }

        return jwt;
      }

      // ============================================================
      // DIRECT GOOGLE WALLET URL
      // ============================================================

      function openWallet() {
        const jwt = getJwt();

        if (!jwt) {
          return;
        }

        const walletUrl = "https://pay.google.com/gp/v/save/" + jwt;

        document.getElementById("result").innerText =
          "Opening Google Wallet...\n\n" + walletUrl;

        // Open Google Wallet Save page
        window.location.href = walletUrl;
      }

      // ============================================================
      // GOOGLE WALLET JAVASCRIPT BUTTON
      // ============================================================

      function renderWalletButton() {
        const jwt = getJwt();

        if (!jwt) {
          return;
        }

        const walletButton = document.getElementById("wallet-button");

        // Clear previous button
        walletButton.innerHTML = "";

        document.getElementById("result").innerText =
          "Rendering Google Wallet button...";

        // Render Google Wallet button
        gapi.savetoandroidpay.render("wallet-button", {
          jwt: jwt,

          onsuccess: "googleWalletSuccess",

          onfailure: "googleWalletFailure",
        });
      }

      // ============================================================
      // GOOGLE WALLET SUCCESS
      // ============================================================

      function googleWalletSuccess() {
        document.getElementById("result").innerText =
          "SUCCESS!\n\n" + "The card was added to Google Wallet.";
      }

      // ============================================================
      // GOOGLE WALLET FAILURE
      // ============================================================

      function googleWalletFailure(error) {
        console.log("Google Wallet Error:", error);

        document.getElementById("result").innerText =
          "GOOGLE WALLET ERROR\n\n" +
          "Error Code: " +
          error.errorCode +
          "\n\n" +
          "Error Message: " +
          error.errorMessage;
      }
    </script>
  </body>
</html>
