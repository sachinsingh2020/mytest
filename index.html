<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Google Wallet Test</title>

    <script
      src="https://apis.google.com/js/platform.js"
      type="text/javascript"></script>
  </head>

  <body>
    <h1>Google Wallet Test</h1>

    <textarea
      id="jwt"
      placeholder="Paste Google Wallet JWT here..."
      style="width: 100%; height: 180px">
    </textarea>

    <br /><br />

    <button onclick="loadWalletButton()">Load Google Wallet Button</button>

    <br /><br />

    <div id="wallet-button"></div>

    <div id="result">Waiting for JWT...</div>

    <script>
      function loadWalletButton() {
        const jwt = document.getElementById("jwt").value.trim();

        const result = document.getElementById("result");

        if (!jwt) {
          result.innerText = "ERROR: Please paste the JWT first.";

          return;
        }

        // Clear previous button
        document.getElementById("wallet-button").innerHTML = "";

        // Create Google's official button element
        const button = document.createElement("g:savetoandroidpay");

        button.setAttribute("jwt", jwt);

        button.setAttribute("height", "standard");

        button.setAttribute("size", "matchparent");

        button.setAttribute("onsuccess", "googleWalletSuccess");

        button.setAttribute("onfailure", "googleWalletFailure");

        document.getElementById("wallet-button").appendChild(button);

        // Tell Google to parse the newly-created element
        if (window.gapi && gapi.savetoandroidpay) {
          gapi.savetoandroidpay.go();

          result.innerText = "Google Wallet button loaded.";
        } else {
          result.innerText = "Google Wallet JavaScript API not loaded.";
        }
      }

      function googleWalletSuccess() {
        document.getElementById("result").innerText =
          "SUCCESS! Card was added to Google Wallet.";
      }

      function googleWalletFailure(error) {
        console.log("Google Wallet Error:", error);

        document.getElementById("result").innerText =
          "GOOGLE WALLET ERROR\n\n" +
          "Error Code: " +
          error.errorCode +
          "\n\n" +
          "Error Message: " +
          error.errorMessage;
      }
    </script>
  </body>
</html>
